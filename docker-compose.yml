services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SYNFORGE_DB_NAME:-synforge}
      POSTGRES_USER: ${SYNFORGE_DB_USER:-synforge}
      POSTGRES_PASSWORD: ${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}
    volumes:
      - ${SYNFORGE_DB_PATH:-/data/db}:/var/lib/postgresql/data:rw,z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SYNFORGE_DB_USER:-synforge} -d ${SYNFORGE_DB_NAME:-synforge}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${SYNFORGE_REDIS_PATH:-/data/redis}:/data:rw,z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  rustfs-perms:
    image: busybox:latest
    restart: "no"
    user: root
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data /logs && chown -R 10001:10001 /data /logs",
      ]
    volumes:
      - ${SYNFORGE_OBJECT_STORAGE_PATH:-/data/storage}:/data:rw,z
      - ${SYNFORGE_OBJECT_STORAGE_LOG_PATH:-/data/storage-logs}:/logs:rw,z

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}
      RUSTFS_SECRET_KEY: ${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY:?set SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "${SYNFORGE_MINIO_API_PORT:-9000}:9000"
    volumes:
      - ${SYNFORGE_OBJECT_STORAGE_PATH:-/data/storage}:/data:rw,z
      - ${SYNFORGE_OBJECT_STORAGE_LOG_PATH:-/data/storage-logs}:/logs:rw,z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  object-storage-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://rustfs:9000 \"${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}\" \"${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY}\" && mc mb -p \"local/${SYNFORGE_OBJECT_STORAGE_BUCKET:-synforge}\" || true",
      ]

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["debug-tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SYNFORGE_PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${SYNFORGE_PGADMIN_PASSWORD:?set SYNFORGE_PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${SYNFORGE_PGADMIN_PORT:-5050}:80"
    volumes:
      - ${SYNFORGE_PGADMIN_PATH:-/data/pgadmin}:/var/lib/pgadmin:rw,z
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  object-storage-viewer:
    image: rclone/rclone:latest
    restart: unless-stopped
    profiles: ["debug-tools"]
    environment:
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://rustfs:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY:?set SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
      RCLONE_CONFIG_MINIO_REGION: ${SYNFORGE_OBJECT_STORAGE_REGION:-us-east-1}
      RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE: ${SYNFORGE_OBJECT_STORAGE_PATH_STYLE:-true}
    command:
      [
        "serve",
        "http",
        "minio:${SYNFORGE_OBJECT_STORAGE_BUCKET:-synforge}",
        "--addr",
        ":8080",
        "--read-only",
      ]
    ports:
      - "${SYNFORGE_MINIO_VIEWER_PORT:-8070}:8080"
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5

  daemon:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: daemon-runtime
    image: synforge-daemon:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${SYNFORGE_DB_USER:-synforge}:${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}@postgres:5432/${SYNFORGE_DB_NAME:-synforge}
      REDIS_URL: redis://redis:6379/0
      SYNFORGE_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      SYNFORGE_OBJECT_STORAGE_REGION: ${SYNFORGE_OBJECT_STORAGE_REGION:-us-east-1}
      SYNFORGE_OBJECT_STORAGE_BUCKET: ${SYNFORGE_OBJECT_STORAGE_BUCKET:-synforge}
      SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID: ${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}
      SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY:?set SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
      SYNFORGE_OBJECT_STORAGE_PATH_STYLE: ${SYNFORGE_OBJECT_STORAGE_PATH_STYLE:-true}
      SYNFORGE_WORKER_JOBS_PATH: ${SYNFORGE_WORKER_JOBS_PATH:-/data/jobs}
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ${SYNFORGE_RUNTIME_PATH:-/data/runtime}:/var/lib/synforge:rw,z
      - ${SYNFORGE_WORKER_JOBS_PATH:-/data/jobs}:/var/lib/synforge-worker-jobs:rw,z

  worker-fedora:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: worker-runtime
    image: synforge-worker-fedora:latest
    profiles: ["build-images-only"]
