# Site-wide mock defaults applied to every chroot built inside the
# worker container. Pinned here (rather than relying on distribution
# defaults) so build behaviour is reproducible across host kernels and
# mock versions.

# We run mock inside an unprivileged container with the host's seccomp
# profile; nspawn requires CAP_SYS_ADMIN we don't grant. Use the simpler
# chroot isolation.
config_opts['isolation'] = 'simple'

# Don't bootstrap a separate mock root; the container already provides a
# minimal Fedora userland.
config_opts['use_bootstrap'] = False

# Don't leak the host's /etc/resolv.conf into the chroot — the daemon
# controls network policy via the build-time `network_access` flag.
config_opts['use_host_resolv'] = False

# Periodic cleanup of cache_topdir prevents stale dnf metadata and old
# rpm-build dirs from accumulating across job runs.
config_opts['cache_topdir_enable_cleanup'] = True

# Drop interactive prompts — workers always run unattended.
config_opts['print_main_output'] = False
