name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + clippy + check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

  webui:
    # `apps/webui/src/lib/types.ts` imports from
    # `../generated/api/api-schema`, which is produced by running
    # `cargo run -p synforge-daemon --bin openapi-export` and feeding
    # the JSON to `openapi-typescript`. The generated tree is
    # gitignored, so CI has to regenerate it from a fresh checkout
    # before tsc/vite can typecheck or build.
    name: WebUI (generate + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install WebUI deps
        working-directory: apps/webui
        run: npm ci

      - name: Regenerate OpenAPI schema and TypeScript types
        working-directory: apps/webui
        run: npm run generate:api

      - name: Build WebUI (tsc --noEmit + vite build)
        working-directory: apps/webui
        run: npm run build
