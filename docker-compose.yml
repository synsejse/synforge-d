services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SYNFORGE_DB_NAME:-synforge}
      POSTGRES_USER: ${SYNFORGE_DB_USER:-synforge}
      POSTGRES_PASSWORD: ${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}
    volumes:
      - ${SYNFORGE_DB_PATH:-/data/db}:/var/lib/postgresql/data:rw,z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SYNFORGE_DB_USER:-synforge} -d ${SYNFORGE_DB_NAME:-synforge}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${SYNFORGE_REDIS_PATH:-/data/redis}:/data:rw,z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}
      MINIO_ROOT_PASSWORD: ${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY:?set SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
    ports:
      - "${SYNFORGE_MINIO_API_PORT:-9000}:9000"
      - "${SYNFORGE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${SYNFORGE_OBJECT_STORAGE_PATH:-/data/object-storage}:/data:rw,z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 \"${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}\" \"${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY}\" && mc mb -p \"local/${SYNFORGE_OBJECT_STORAGE_BUCKET:-synforge}\" || true",
      ]

  daemon:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: daemon-runtime
    image: synforge-daemon:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${SYNFORGE_DB_USER:-synforge}:${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}@postgres:5432/${SYNFORGE_DB_NAME:-synforge}
      REDIS_URL: redis://redis:6379/0
      SYNFORGE_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      SYNFORGE_OBJECT_STORAGE_REGION: ${SYNFORGE_OBJECT_STORAGE_REGION:-us-east-1}
      SYNFORGE_OBJECT_STORAGE_BUCKET: ${SYNFORGE_OBJECT_STORAGE_BUCKET:-synforge}
      SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID: ${SYNFORGE_OBJECT_STORAGE_ACCESS_KEY_ID:-synforge-minio}
      SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY:?set SYNFORGE_OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
      SYNFORGE_OBJECT_STORAGE_PATH_STYLE: ${SYNFORGE_OBJECT_STORAGE_PATH_STYLE:-true}
      SYNFORGE_WORKER_JOBS_PATH: ${SYNFORGE_WORKER_JOBS_PATH:-/data/worker-jobs}
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ${SYNFORGE_RUNTIME_PATH:-/data/runtime}:/var/lib/synforge:rw,z
      - ${SYNFORGE_WORKER_JOBS_PATH:-/data/worker-jobs}:/var/lib/synforge-worker-jobs:rw,z

  worker-fedora:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: worker-runtime
    image: synforge-worker-fedora:latest
    profiles: ["build-images-only"]
