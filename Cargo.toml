[workspace]
members = [
    "libs/rust/core",
    "libs/rust/store",
    "libs/rust/runtime",
    "libs/rust/orchestrator",
    "libs/rust/serve",
    "libs/rust/worker",
    "apps/rust/daemon",
    "apps/rust/worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["synse"]

[workspace.dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["macros"] }
axum-helmet = "1.0.1"
base64 = "0.22.1"
bigdecimal = "0.4.10"
bollard = "0.20.2"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
diesel = { version = "2.3.7", features = ["mysql", "numeric", "r2d2"] }
diesel_migrations = "2.3.1"
flate2 = "1.1.9"
futures-util = { version = "0.3.32", features = ["sink"] }
glob = "0.3.3"
hmac = "0.13.0"
helmet-core = "1.0.0"
idna = "1.1.0"
ini = { package = "rust-ini", version = "0.21.3" }
notify = "8.2.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rkyv = "0.8.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
slug = "0.1.6"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.51.0", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec", "io", "rt"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["auth", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "time", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.23.0", features = ["serde", "v7"] }
xz2 = "0.1.7"
