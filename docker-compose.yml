services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${SYNFORGE_DB_NAME:-synforge}
      MARIADB_USER: ${SYNFORGE_DB_USER:-synforge}
      MARIADB_PASSWORD: ${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${SYNFORGE_DB_ROOT_PASSWORD:?set SYNFORGE_DB_ROOT_PASSWORD in .env}
    volumes:
      - ${SYNFORGE_DB_PATH:-/data/db}:/var/lib/mysql:rw,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    profiles: ["dev-tools"]
    ports:
      - "${SYNFORGE_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${SYNFORGE_DB_USER:-synforge}
      PMA_PASSWORD: ${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}
    depends_on:
      mariadb:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  daemon:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: daemon-runtime
    image: synforge-daemon:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql://${SYNFORGE_DB_USER:-synforge}:${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}@mariadb:3306/${SYNFORGE_DB_NAME:-synforge}
      SYNFORGE_WORKER_JOBS_PATH: ${SYNFORGE_WORKER_JOBS_PATH:-/data/worker-jobs}
    expose:
      - "8090"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ${SYNFORGE_RUNTIME_PATH:-/data/runtime}:/var/lib/synforge:rw,z
      - ${SYNFORGE_WORKER_JOBS_PATH:-/data/worker-jobs}:/var/lib/synforge-worker-jobs:rw,z

  worker-fedora:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: worker-runtime
    image: synforge-worker-fedora:latest
    profiles: ["build-images-only"]
