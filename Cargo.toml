[workspace]
members = [
    "libs/rust/core",
    "libs/rust/orchestrator",
    "libs/rust/serve",
    "libs/rust/worker",
    "apps/rust/daemon",
    "apps/rust/worker",
    "apps/rust/webui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["synse"]

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["macros"] }
base64 = "0.22.1"
bincode = "1.3.3"
bollard = "0.19.4"
bytes = "1.10.1"
clap = { version = "4.5.48", features = ["derive", "env"] }
diesel = { version = "2.2.6", features = ["mysql", "r2d2"] }
diesel_migrations = "2.2.0"
flate2 = "1.1.2"
futures-util = { version = "0.3.31", features = ["sink"] }
glob = "0.3.3"
hmac = "0.12.1"
ini = { package = "rust-ini", version = "0.21.1" }
notify = "8.2.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.47.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.13", features = ["codec", "io", "rt"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["auth", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "time", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
xz2 = "0.1.7"
