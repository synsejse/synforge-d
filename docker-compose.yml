services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: synforge
      MARIADB_USER: synforge
      MARIADB_PASSWORD: synforge_dev
      MARIADB_ROOT_PASSWORD: synforge_root
    volumes:
      - synforge-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: synforge
      PMA_PASSWORD: synforge_dev
    depends_on:
      mariadb:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  daemon:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: daemon-runtime
    image: synforge-daemon:latest
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      DATABASE_URL: mysql://synforge:synforge_dev@mariadb:3306/synforge
    expose:
      - "8080"
      - "8090"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - synforge-runtime:/var/lib/synforge

  webui:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: webui-runtime
    image: synforge-webui:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  worker-fedora:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: worker-runtime
    image: synforge-worker-fedora:latest
    profiles: ["build-images-only"]

volumes:
  synforge-db:
  synforge-runtime:
