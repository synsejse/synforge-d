services:
  daemon:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: daemon-runtime
    image: synforge-daemon:latest
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      SYNFORGE_BEARER_TOKEN: ${SYNFORGE_BEARER_TOKEN:?SYNFORGE_BEARER_TOKEN must be set}
      SYNFORGE_WORKER_IMAGE: synforge-worker-fedora:latest
      SYNFORGE_PUBLIC_BASE_URL: http://localhost:8080
    expose:
      - "8080"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - synforge-runtime:/var/lib/synforge

  webui:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: webui-runtime
    image: synforge-webui:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  worker-fedora:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: worker-runtime
    image: synforge-worker-fedora:latest
    profiles: ["build-images-only"]

volumes:
  synforge-runtime:
