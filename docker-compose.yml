# Synforge dev / single-host deployment.
#
# Required env (read from .env):
#   SYNFORGE_DB_PASSWORD       — Postgres password (no default; required)
#   SYNFORGE_PGADMIN_PASSWORD  — only if you launch the debug-tools profile
#
# Optional env (sensible defaults shown inline):
#   SYNFORGE_DB_NAME / SYNFORGE_DB_USER
#   SYNFORGE_DB_PATH / SYNFORGE_REDIS_PATH / SYNFORGE_PGADMIN_PATH
#   SYNFORGE_RUNTIME_PATH / SYNFORGE_WORKER_JOBS_PATH
#   SYNFORGE_PGADMIN_PORT / SYNFORGE_PGADMIN_EMAIL
#
# Profiles:
#   (default)         — postgres + redis + daemon
#   debug-tools       — adds pgadmin
#   build-images-only — builds the worker-fedora image without running it
#                       (the daemon spawns worker containers on demand)

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SYNFORGE_DB_NAME:-synforge}
      POSTGRES_USER: ${SYNFORGE_DB_USER:-synforge}
      POSTGRES_PASSWORD: ${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}
    volumes:
      - ${SYNFORGE_DB_PATH:-/data/db}:/var/lib/postgresql/data:rw,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNFORGE_DB_USER:-synforge} -d ${SYNFORGE_DB_NAME:-synforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${SYNFORGE_REDIS_PATH:-/data/redis}:/data:rw,z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  daemon:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: daemon-runtime
    image: synforge-daemon:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SYNFORGE_DB_USER:-synforge}:${SYNFORGE_DB_PASSWORD:?set SYNFORGE_DB_PASSWORD in .env}@postgres:5432/${SYNFORGE_DB_NAME:-synforge}
      REDIS_URL: redis://redis:6379/0
      SYNFORGE_WORKER_JOBS_PATH: ${SYNFORGE_WORKER_JOBS_PATH:-/data/jobs}
    ports:
      # 8090 (worker socket) is intentionally not exposed to the host.
      - "8080:8080"
    volumes:
      # Daemon spawns worker containers via the host docker socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ${SYNFORGE_RUNTIME_PATH:-/data/runtime}:/var/lib/synforge:rw,z
      # Shared with worker containers spawned by the daemon.
      - ${SYNFORGE_WORKER_JOBS_PATH:-/data/jobs}:/var/lib/synforge-worker-jobs:rw,z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Image is built but never run here — the daemon spawns one container
  # per build job. Pinned to a profile so `docker compose up` skips it.
  worker-fedora:
    build:
      context: .
      dockerfile: docker/services.Dockerfile
      target: worker-runtime
    image: synforge-worker-fedora:latest
    profiles: ["build-images-only"]

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    user: "5050:5050"
    profiles: ["debug-tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SYNFORGE_PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${SYNFORGE_PGADMIN_PASSWORD:?set SYNFORGE_PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${SYNFORGE_PGADMIN_PORT:-5050}:80"
    volumes:
      - ${SYNFORGE_PGADMIN_PATH:-/data/pgadmin}:/var/lib/pgadmin:rw,z
